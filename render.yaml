# Render Blueprint – PRODUKSJON: web-tjeneste + Postgres 16 i Frankfurt.
# Begge bruker betalte planer (Render har ikke gratis Postgres). Serveren nekter å starte før alt som trengs
# for ekte salg er satt: se docs/drift.md. For en ren demo uten nøkler, bruk render.staging.yaml.
services:
  - type: web
    name: tikit
    runtime: node
    region: frankfurt
    # --include=dev: NODE_ENV=production gjelder også under bygging, og uten dette hopper npm over vite/esbuild.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DEMO_MODE
        value: "false"
      # Render ligger bak Cloudflare: den ekte klient-IP-en (for rate limiting) står i denne headeren.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tikit-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OPERATOR_NAME
        value: Din Russetid AS
      - key: OPERATOR_ORG_NUMBER
        value: "936 491 243"
      - key: SUPPORT_EMAIL
        sync: false
      - key: VIPPS_ENV
        value: production
      - key: VIPPS_CLIENT_ID
        sync: false
      - key: VIPPS_CLIENT_SECRET
        sync: false
      - key: VIPPS_SUBSCRIPTION_KEY
        sync: false
      - key: VIPPS_MSN
        sync: false
      - key: VIPPS_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: tikit-db
    region: frankfurt
    postgresMajorVersion: "16"
    # Bare interne tilkoblinger (fra web-tjenesten). Databasen er ikke åpen mot internett.
    ipAllowList: []
